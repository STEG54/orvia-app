; Amaya : pool PHP-FPM d'une agence, sous son propre utilisateur système, enfermé dans son dossier.
[amaya-__AGENCE__]
user = amaya-__AGENCE__
group = amaya-__AGENCE__
listen = /run/php/amaya-__AGENCE__.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660
pm = ondemand
pm.max_children = 8
pm.process_idle_timeout = 30s
php_admin_value[open_basedir] = __RACINE__/:/usr/share/zoneinfo/
php_admin_value[sys_temp_dir] = __RACINE__/tmp
php_admin_value[upload_tmp_dir] = __RACINE__/tmp
php_admin_value[session.save_path] = __RACINE__/tmp
php_admin_value[disable_functions] = exec,passthru,shell_exec,system,proc_open,popen,pcntl_exec
php_admin_value[display_errors] = Off
php_admin_value[log_errors] = On
php_admin_value[error_log] = __RACINE__/journaux/php.log
php_admin_value[memory_limit] = 256M
php_admin_value[upload_max_filesize] = 12M
php_admin_value[post_max_size] = 14M
php_admin_value[expose_php] = Off
