# Amaya : une agence = un site Nginx, un pool PHP-FPM sous son propre utilisateur système, sa base.
# Les règles du .htaccess d'Apache sont reprises ici (Nginx ne lit pas les .htaccess).
server {
    listen __PORT__;
    server_name __DOMAINE__;
    root __RACINE__/www;
    index index.php;
    client_max_body_size 14m;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options "nosniff" always;
    __TLS__

    # Fichiers jamais servis : réglages, bibliothèques, modèles, schéma, documentation, bibliothèque PDF.
    location ~ ^/(config\.php|lib\.php|[a-z_]+_lib\.php|cron\.php|[a-z]+_defaut\.txt|install\.sql|LISEZMOI\.md|BUILD\.txt)$ { return 403; }
    location ^~ /dompdf/ { return 403; }
    location ^~ /prive/ { return 403; }
    # Dossiers privés des fichiers : documents chiffrés, sessions, sauvegardes.
    location ^~ /uploads/fiches/ { return 403; }
    location ~ ^/uploads/\. { return 403; }
    location ~ /\. { return 403; }
    # Aucun script n'est exécuté dans uploads/.
    location ~ ^/uploads/.*\.(php|phtml|php\d|phar|pl|py|cgi|sh)$ { return 403; }
    # Photos : jamais en accès direct, toujours par photo.php (connexion ou lien signé vérifiés).
    location ~ "^/uploads/[a-f0-9]{32}(_t)?\.jpg$" { return 403; }
    location /uploads/ { try_files $uri =404; }

    location = /installer { rewrite ^ /installer.php last; }
    location ~ \.webmanifest$ { types { } default_type application/manifest+json; }
    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTPS $amaya_https;
        fastcgi_pass unix:/run/php/amaya-__AGENCE__.sock;
        fastcgi_read_timeout 300;
    }
    location / { try_files $uri $uri/ =404; }
}
